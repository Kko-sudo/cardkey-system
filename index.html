<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .key-item {
            background: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            font-family: monospace;
            font-size: 14px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #f8f9fa;
            font-weight: bold;
            color: #333;
        }
        
        tr:hover {
            background: #f5f5f5;
        }
        
        .status-unused {
            color: #28a745;
            font-weight: bold;
        }
        
        .status-used {
            color: #dc3545;
            font-weight: bold;
        }
        
        .btn-delete {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 14px;
        }
        
        .btn-delete:hover {
            background: #c82333;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 10px;
        }
        
        .copy-btn {
            background: #28a745;
            padding: 6px 12px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .copy-btn:hover {
            background: #218838;
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .logout-btn {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 14px;
            margin-left: auto;
        }
        
        .logout-btn:hover {
            background: #c82333;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2em;
        }
        
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loginSection" class="login-container">
        <div class="login-card">
            <h2 style="text-align: center; color: #333; margin-bottom: 30px;">登录系统</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button onclick="login()" style="width: 100%;">登录</button>
        </div>
    </div>
    
    <div id="mainSection" class="container hidden">
        <div class="header">
            <h1>🔐 卡密管理系统</h1>
            <button class="logout-btn" onclick="logout()">退出登录</button>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalKeys">0</div>
                <div class="stat-label">总卡密数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unusedKeys">0</div>
                <div class="stat-label">未使用</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="usedKeys">0</div>
                <div class="stat-label">已使用</div>
            </div>
        </div>
        
        <div class="card">
            <h2>生成卡密</h2>
            <div class="form-group">
                <label for="duration">有效期（天）</label>
                <input type="number" id="duration" min="1" value="30" placeholder="请输入有效期天数">
            </div>
            <div class="form-group">
                <label for="count">生成数量</label>
                <input type="number" id="count" min="1" max="100" value="1" placeholder="请输入生成数量">
            </div>
            <button onclick="generateKeys()">生成卡密</button>
            
            <div class="result" id="result">
                <h3>生成的卡密：</h3>
                <div id="keysList"></div>
                <button class="copy-btn" onclick="copyAllKeys()" style="margin-top: 10px;">复制所有卡密</button>
            </div>
        </div>
        
        <div class="card">
            <h2>卡密列表</h2>
            <button onclick="loadKeys()" style="margin-bottom: 15px;">刷新列表</button>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>卡密</th>
                        <th>有效期（天）</th>
                        <th>状态</th>
                        <th>创建时间</th>
                        <th>过期时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="keysTable">
                </tbody>
            </table>
        </div>
        
        <div class="card">
            <h2>程序管理</h2>
            <div class="form-group">
                <label for="programName">程序名称</label>
                <input type="text" id="programName" placeholder="请输入程序名称">
            </div>
            <div class="form-group">
                <label for="programPath">程序路径</label>
                <input type="text" id="programPath" placeholder="请输入程序路径（例如：.data\\app_core.exe）">
            </div>
            <button onclick="addProgram()">添加程序</button>
            
            <table style="margin-top: 20px;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>程序名称</th>
                        <th>程序路径</th>
                        <th>创建时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="programsTable">
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let authToken = localStorage.getItem('authToken');
        let generatedKeys = [];
        
        function checkAuth() {
            if (authToken) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainSection').classList.remove('hidden');
                loadKeys();
            } else {
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('mainSection').classList.add('hidden');
            }
        }
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('authToken', authToken);
                    checkAuth();
                } else {
                    alert('登录失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('登录失败：' + error.message);
            }
        }
        
        function logout() {
            authToken = null;
            localStorage.removeItem('authToken');
            checkAuth();
        }
        
        async function generateKeys() {
            const duration = document.getElementById('duration').value;
            const count = document.getElementById('count').value;
            
            try {
                const response = await fetch('/api/generate-key', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ duration: parseInt(duration), count: parseInt(count) })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    generatedKeys = data.keys.map(k => k.key_code);
                    const keysList = document.getElementById('keysList');
                    keysList.innerHTML = data.keys.map(key => 
                        `<div class="key-item">${key.key_code} (有效期: ${key.duration}天)</div>`
                    ).join('');
                    document.getElementById('result').classList.add('show');
                    loadKeys();
                } else {
                    alert('生成失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('生成失败：' + error.message);
            }
        }
        
        function copyAllKeys() {
            const text = generatedKeys.join('\n');
            navigator.clipboard.writeText(text).then(() => {
                alert('已复制所有卡密到剪贴板');
            }).catch(err => {
                alert('复制失败：' + err.message);
            });
        }
        
        async function loadKeys() {
            try {
                const response = await fetch('/api/keys', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const keys = await response.json();
                
                const tbody = document.getElementById('keysTable');
                tbody.innerHTML = keys.map(key => `
                    <tr>
                        <td>${key.id}</td>
                        <td>${key.key_code}</td>
                        <td>${key.duration}</td>
                        <td class="status-${key.status}">${key.status === 'unused' ? '未使用' : '已使用'}</td>
                        <td>${new Date(key.created_at).toLocaleString('zh-CN')}</td>
                        <td>${new Date(key.expires_at).toLocaleString('zh-CN')}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteKey(${key.id})">删除</button>
                        </td>
                    </tr>
                `).join('');
                
                document.getElementById('totalKeys').textContent = keys.length;
                document.getElementById('unusedKeys').textContent = keys.filter(k => k.status === 'unused').length;
                document.getElementById('usedKeys').textContent = keys.filter(k => k.status === 'used').length;
            } catch (error) {
                alert('加载失败：' + error.message);
            }
        }
        
        async function deleteKey(id) {
            if (!confirm('确定要删除这个卡密吗？')) return;
            
            try {
                const response = await fetch(`/api/keys/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    loadKeys();
                } else {
                    alert('删除失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }
        
        async function loadPrograms() {
            try {
                const response = await fetch('/api/programs', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const programs = await response.json();
                
                const tbody = document.getElementById('programsTable');
                tbody.innerHTML = programs.map(program => `
                    <tr>
                        <td>${program.id}</td>
                        <td>${program.name}</td>
                        <td>${program.path}</td>
                        <td>${new Date(program.created_at).toLocaleString('zh-CN')}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteProgram(${program.id})">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                alert('加载失败：' + error.message);
            }
        }
        
        async function addProgram() {
            const name = document.getElementById('programName').value;
            const path = document.getElementById('programPath').value;
            
            if (!name || !path) {
                alert('请填写程序名称和路径');
                return;
            }
            
            try {
                const response = await fetch('/api/programs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ name, path })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('programName').value = '';
                    document.getElementById('programPath').value = '';
                    loadPrograms();
                } else {
                    alert('添加失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('添加失败：' + error.message);
            }
        }
        
        async function deleteProgram(id) {
            if (!confirm('确定要删除这个程序吗？')) return;
            
            try {
                const response = await fetch(`/api/programs/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    loadPrograms();
                } else {
                    alert('删除失败：' + (data.error || '未知错误'));
                }
            } catch (error) {
                alert('删除失败：' + error.message);
            }
        }
        
        checkAuth();
        loadPrograms();
    </script>
</body>
</html>
